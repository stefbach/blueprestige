<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visite 3D — Blue Prestige Mauritius</title>
    <meta
      name="description"
      content="Visite virtuelle 3D, plan interactif et home staging de la villa Blue Prestige."
    />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="view"></canvas>

        <div id="loading">Chargement de la villa…</div>

        <header id="topbar">
          <div class="brand">Blue&nbsp;Prestige</div>
          <div class="seg" role="group" aria-label="Mode d’affichage">
            <button data-mode="walk" class="is-active">Visite</button>
            <button data-mode="dollhouse">Maquette</button>
          </div>
          <div class="seg" role="group" aria-label="Niveau">
            <button data-level="0" class="is-active">Rez</button>
            <button data-level="1">Étage</button>
          </div>
          <button id="panel-toggle" aria-label="Afficher le plan">Plan</button>
        </header>

        <div id="viewpoints" class="chips" aria-label="Points de vue"></div>

        <div id="hud">
          <div id="stick" aria-hidden="true"><div class="stick-knob"></div></div>
          <p class="hint">
            Glissez pour regarder · <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> pour marcher ·
            <kbd>Maj</kbd> pour courir
          </p>
        </div>

        <div id="daylight">
          <label for="hour">Heure</label>
          <input id="hour" type="range" min="6" max="18" step="1" value="15" />
          <output id="hour-label">15h00</output>
        </div>
      </div>

      <aside id="panel">
        <div class="panel-section">
          <label for="staging">Home staging</label>
          <select id="staging"></select>
        </div>

        <div class="panel-section grow">
          <div id="plan"></div>
        </div>

        <div id="room-info" class="panel-section" hidden>
          <h3></h3>
          <p class="room-meta"></p>
          <p class="room-note"></p>
        </div>

        <p class="disclaimer">
          Modèle reconstruit à partir des photos du bien. Cotes estimées, tolérance ±10 %,
          sans valeur contractuelle.
        </p>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
